<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

  #game {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }
  canvas {
    display: block;
    image-rendering: auto;
    filter: saturate(1.08) contrast(1.04);
  }
  .dom-layer {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, rgba(0, 255, 213, 0.08), rgba(0,0,0,0.88) 55%);
    backdrop-filter: blur(3px);
    pointer-events: auto;
  }
  .panel {
    width: min(940px, calc(100vw - 28px));
    padding: 22px;
    border: 1px solid rgba(0, 255, 213, 0.32);
    border-radius: 24px;
    background: linear-gradient(180deg, rgba(8, 15, 24, 0.96), rgba(5, 7, 12, 0.98));
    box-shadow: 0 0 34px rgba(0, 255, 213, 0.18), inset 0 0 24px rgba(255,255,255,0.03);
    color: white;
  }
  .title {
    margin: 0;
    text-align: center;
    font-size: clamp(34px, 8vw, 76px);
    letter-spacing: 12px;
    color: #00ffd5;
    text-shadow: 0 0 22px rgba(0,255,213,0.75);
    font-weight: 900;
  }
  .subtitle {
    text-align: center;
    color: #9ab8c8;
    margin: 8px 0 10px;
    letter-spacing: 2px;
    font-size: 13px;
  }
  .sponsor {
    text-align: center;
    color: #ffdd66;
    margin: 0 0 18px;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(255, 221, 102, 0.45);
    font-size: 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .choices {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

    border: 1px solid rgba(129, 231, 255, 0.28);

    <div id="choiceGrid" class="choices"></div>
  </div>
</div>

<script>
window.addEventListener("error", function(e) {
  const layer = document.getElementById("startLayer");
  const box = document.getElementById("bootError");
  if (layer) layer.style.display = "flex";
  if (box) {
    box.style.display = "block";
    box.textContent = "실행 오류: " + (e.message || "알 수 없는 오류") + " / V6에서 player.setDamping 오류 제거 완료. 그래도 오류가 뜨면 이 문구 전체를 캡처해서 보내기.";
  }
});
window.addEventListener("unhandledrejection", function(e) {
  const layer = document.getElementById("startLayer");
  const box = document.getElementById("bootError");
  if (layer) layer.style.display = "flex";
  if (box) {
    box.style.display = "block";
    box.textContent = "로드 오류: " + (e.reason && e.reason.message ? e.reason.message : e.reason || "알 수 없는 오류");
  }
});
</script>

  function cnum(hex) {
    return Number("0x" + hex.replace("#", ""));
  }

  function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
  }

  function d(x1, y1, x2, y2) {
    return Phaser.Math.Distance.Between(x1, y1, x2, y2);
  }

  function aTo(x1, y1, x2, y2) {
    return Phaser.Math.Angle.Between(x1, y1, x2, y2);
  }

  function lineDist(px, py, x1, y1, x2, y2) {
    const A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
    const dot = A * C + B * D;
    const len = C * C + D * D;
    let t = len ? dot / len : -1;
    t = clamp(t, 0, 1);
    const x = x1 + C * t, y = y1 + D * t;
    return d(px, py, x, y);
  }

  function makeCanvasTexture(scene, key, w, h, draw) {
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, w, h);
    draw(ctx, w, h);
    scene.textures.addCanvas(key, canvas);
  }

  function glow(ctx, color, blur) {
    ctx.shadowColor = color;
    ctx.shadowBlur = blur;
  }

  function createTextures(scene) {
    // 사람형 플레이어와 몬스터 스프라이트는 Kenney Tiny Dungeon(CC0) 외부 에셋에서 추출해 preload로 불러온다.
    // 여기서는 공격 이펙트용 작은 코어 텍스처만 생성한다.
    makeCanvasTexture(scene, "bulletCore", 32, 32, (ctx, w, h) => {
      ctx.translate(w/2,h/2);
      glow(ctx, "#ffffff", 14);
      ctx.fillStyle="#ffffff";
      ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
    });
  }

  function buildPixelAvatarDataUrl(img, pixelSize = 20, outputSize = 64) {
    const srcCanvas = document.createElement("canvas");
    srcCanvas.width = pixelSize;
    srcCanvas.height = pixelSize;
    const sctx = srcCanvas.getContext("2d", { willReadFrequently: true });
    sctx.clearRect(0,0,pixelSize,pixelSize);
    const iw = img.naturalWidth || img.width || pixelSize;
    const ih = img.naturalHeight || img.height || pixelSize;
    const side = Math.min(iw, ih);
    const sx = (iw - side) / 2;
    const sy = (ih - side) / 2;
    sctx.imageSmoothingEnabled = true;
    sctx.drawImage(img, sx, sy, side, side, 0, 0, pixelSize, pixelSize);

    const data = sctx.getImageData(0,0,pixelSize,pixelSize);
    for (let i = 0; i < data.data.length; i += 4) {
      data.data[i] = Math.min(255, data.data[i] * 1.08);
      data.data[i + 1] = Math.min(255, data.data[i + 1] * 1.04);
      data.data[i + 2] = Math.min(255, data.data[i + 2] * 1.08);
    }
    sctx.putImageData(data, 0, 0);

    const outCanvas = document.createElement("canvas");
    outCanvas.width = outputSize;
    outCanvas.height = outputSize;
    const octx = outCanvas.getContext("2d");
    octx.clearRect(0,0,outputSize,outputSize);
    octx.imageSmoothingEnabled = false;
    octx.drawImage(srcCanvas, 0, 0, outputSize, outputSize);
    octx.strokeStyle = "rgba(0,255,213,0.65)";
    octx.lineWidth = 2;
    octx.strokeRect(1,1,outputSize-2,outputSize-2);
    return outCanvas.toDataURL("image/png");
  }

  function updateAvatarPreviewDom() {
    const preview = document.getElementById("avatarPreview");
    const hint = document.getElementById("avatarHint");
    if (!preview || !hint) return;
    if (state.customPlayerPreview) {
      preview.src = state.customPlayerPreview;
      preview.classList.add("show");
      hint.innerHTML = "적용 완료. START를 누르면 업로드한 사진의 픽셀 버전으로 플레이합니다.<br>좌우 이동에 따라 자동으로 방향 전환됩니다.";
    } else {
      preview.removeAttribute("src");
      preview.classList.remove("show");
      hint.textContent = "사진을 넣으면 중앙 기준으로 잘라서 자동 픽셀화하고, 그 이미지를 플레이어 캐릭터로 사용합니다.";
    }
  }

  function applyCustomPlayerTexture(scene, dataUrl) {
    if (!scene || !scene.textures || !dataUrl) return;
    const key = "playerCustom";
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = img.width || 64;
      canvas.height = img.height || 64;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0);
      if (scene.textures.exists(key)) scene.textures.remove(key);
      scene.textures.addCanvas(key, canvas);
      state.playerTextureKey = key;
      state.customPlayerPreview = dataUrl;
      if (player && player.active) {
        player.setTexture(key);
        player.setDisplaySize(64,64);
        player.rotation = 0;
      }
      updateAvatarPreviewDom();
    };
    img.src = dataUrl;
  }

  function resetCustomPlayerTexture(scene) {
    state.playerTextureKey = "playerShip";
    state.customPlayerPreview = "";
    if (scene && scene.textures && scene.textures.exists("playerCustom")) scene.textures.remove("playerCustom");
    if (player && player.active) {
      player.setTexture("playerShip");
      player.setDisplaySize(64,64);
      player.setFlipX(false);
      player.rotation = 0;
    }
    updateAvatarPreviewDom();
  }


  function applyImmediateWeaponBonus(id, before, after) {
    const gained = Math.max(0, after - before);
    if (gained <= 0) return;

    if (id === "hsBelly") {
      for (let i = 0; i < gained; i++) {
        const oldMax = state.maxHp;
        state.maxHp = Math.round(state.maxHp * 1.05);
        state.hp = Math.min(state.maxHp, state.hp + Math.max(5, Math.round((state.maxHp - oldMax) + 3)));
      }
      const scene = state.scene;
      if (scene && state.started) centerText(scene, "MAX HP +5%", "#ffbf5a");
    }
  }

  function brainExpMultiplier() {
    const lv = manager && manager.level ? manager.level("brain") : 0;
    if (!lv) return 1;
    return 1.5 + (lv - 1) * 0.1;
  }

  class WeaponManager {
    constructor(scene) {
      this.scene = scene;
      this.weapons = [];
      this.fusions = [];
      this.maxWeapons = 9;
    }
    tick(time, delta) {
      for (const w of this.weapons) w.tick(time, delta);
      for (const f of this.fusions) f.tick(time, delta);
    }
    get(id) { return this.weapons.find(w => w.id === id); }
    level(id) { return this.get(id)?.level || 0; }
    addWeapon(id) {
      const before = this.level(id);
      const existing = this.get(id);
      if (existing) {
        existing.level = Math.min(5, existing.level + 1);
      } else if (this.weapons.length < this.maxWeapons) {
        this.weapons.push(new Weapon(this.scene, id));
      }
      const after = this.level(id);
      applyImmediateWeaponBonus(id, before, after);
      updateWeaponUi();
    }
    addFusion(id) {
      if (!this.fusions.some(f => f.id === id)) this.fusions.push(new Fusion(this.scene, id));
      updateWeaponUi();
    }
    possibleFusions() {
      return FUSIONS.filter(f => !this.fusions.some(x => x.id === f.id) && f.need.every(id => this.level(id) >= 5));
    }
    options() {
      const result = [];
      const possibleFusions = Phaser.Utils.Array.Shuffle(this.possibleFusions().slice());
      for (const f of possibleFusions) {
        if (result.length < 2) result.push({ ...f, type: "fusion" });
      }

      const owned = this.weapons.map(w => w.id);
      const maxed = this.weapons.filter(w => w.level >= 5).map(w => w.id);
      const pool = [];

      for (const w of WEAPONS) {
        if (maxed.includes(w.id)) continue;
        if (owned.includes(w.id)) pool.push({ ...w, type: "upgrade", next: this.level(w.id) + 1 });
        else if (owned.length < this.maxWeapons) {
          pool.push({ ...w, type: "new", next: 1 });
          if (state.level >= 5) pool.push({ ...w, type: "new", next: 1 });
        }
      }

      const shuffled = Phaser.Utils.Array.Shuffle(pool);
      for (const w of shuffled) {
        if (result.length >= 3) break;
        if (!result.some(x => x.id === w.id)) result.push(w);
      }

      if (result.length === 0) {
        result.push({ id: "heal", name: "응급 회복", color: "#ff6666", desc: "체력을 35 회복", type: "heal" });
      }
      return result.slice(0, 3);
    }
  }

  class Weapon {
    constructor(scene, id) {
      this.scene = scene;
      this.id = id;
      this.level = 1;
      this.last = 0;
      this.angle = 0;
      this.parts = [];
      this.mines = [];
      this.hitCd = new Map();
    }
    dmg() { return DMG[this.id][this.level - 1]; }
    ready(time, cd) { return time >= this.last + cd; }
    tick(time, delta) {
      const id = this.id;
      if (id === "mg") return this.mg(time);
      if (id === "missile") return this.missile(time);
      if (id === "bolt") return this.bolt(time);
      if (id === "blade") return this.blade(time);
      if (id === "laser") return this.laser(time);
      if (id === "hole") return this.hole(time);
      if (id === "shield") return this.shield(time, delta);
      if (id === "mine") return this.mine(time);
      if (id === "ice") return this.ice(time);
      if (id === "hsBelly") return this.hsBelly(time);
      if (id === "jjyGlasses") return this.jjyGlasses(time);
      if (id === "sausage") return this.sausage(time, delta);
      if (id === "anseongWave") return this.anseongWave(time);
      if (id === "brain") return this.brain(time);
      if (id === "cameraFlash") return this.cameraFlash(time);
      if (id === "stone") return this.stone(time);
      if (id === "lung") return this.lung(time);
    }
    mg(time) {
      const cd = this.level >= 4 ? 125 : this.level >= 2 ? 165 : 210;
      if (!this.ready(time, cd)) return;
      this.last = time;
      const t = nearestEnemy();
      if (!t) return;
      const count = this.level >= 2 ? 2 : 1;
      for (let i=0;i<count;i++) {
        this.scene.time.delayedCall(i*32, () => shootBullet(this.scene, t, {
          color: 0xfff067, speed: 720, size: 5, damage: this.dmg(), pierce: this.level >= 3 ? 1 : 0, trail: true,
        }));
      }
    }
    missile(time) {
      const cd = this.level >= 3 ? 470 : 620;
      if (!this.ready(time, cd)) return;
      this.last = time;
      const count = this.level >= 5 ? 4 : this.level >= 2 ? 2 : 1;
      for (let i=0;i<count;i++) {
        this.scene.time.delayedCall(i*70, () => {
          const t = nearestEnemy();
          if (!t) return;
          const b = makeBullet(this.scene, player.x, player.y, 0xc59aff, 9);
          b.damage = this.dmg();
          b.homing = true;
          b.target = t;
          b.speed = 470;
          b.explode = this.level >= 4 ? 50 : 0;
        });
      }
    }
    bolt(time) {
      const cd = this.level >= 3 ? 640 : 880;
      if (!this.ready(time, cd)) return;
      this.last = time;
      const targets = enemiesInRange(player.x, player.y, 780, this.level >= 5 ? 5 : this.level >= 2 ? 2 : 1);
      for (const e of targets) {
        lightning(this.scene, e.x, e.y);
        e.stunUntil = Math.max(e.stunUntil || 0, time + (this.level >= 4 ? 560 : 280));
        damageEnemy(this.scene, e, this.dmg());
      }
    }
    blade(time) {
      const cd = this.level >= 3 ? 430 : 600;
      if (!this.ready(time, cd)) return;
      this.last = time;
      const r = this.level >= 4 ? 130 : 96;
      slash(this.scene, player.x, player.y, state.lastMoveAngle, r, 0xffffff);
      enemiesInRange(player.x, player.y, r + 24).forEach(e => {
        damageEnemy(this.scene, e, this.dmg());
        knock(e, player.x, player.y, this.level >= 4 ? 260 : 180);
      });
      if (this.level >= 5) {
        const t = nearestEnemy();
        if (t) shootBullet(this.scene, t, { color: 0xff91ff, speed: 560, size: 8, damage: this.dmg()*.7, homing: true, target: t, pierce: 2 });
      }
    }
    laser(time) {
      const cd = this.level >= 4 ? 620 : 950;
      if (!this.ready(time, cd)) return;
      this.last = time;
      const t = nearestEnemy();
      if (!t) return;
      const base = aTo(player.x, player.y, t.x, t.y);
      const count = this.level >= 5 ? 3 : this.level >= 2 ? 2 : 1;
      for (let i=0;i<count;i++) {
        const off = (i - (count-1)/2) * .18;
        this.scene.time.delayedCall(i*60, () => beam(this.scene, base+off, 840, 32, this.dmg(), 0xff67ff));
      }
    }
    hole(time) {
      const cd = this.level >= 3 ? 1600 : 2200;
      if (!this.ready(time, cd)) return;
      this.last = time;
      const t = highestEnemy() || nearestEnemy();
      if (!t) return;
      gravity(this.scene, t.x, t.y, this.level >= 4 ? 250 : 185, 1200 + this.level*180, this.dmg());
    }
    shield(time, delta) {
      const count = this.level >= 2 ? 2 : 1;
      while (this.parts.length < count) {
        this.parts.push(this.scene.add.sprite(player.x, player.y, "assetShield").setDisplaySize(42,42).setTint(0x66ffcc).setDepth(42));
      }
      this.angle += delta * .0048;
      const r = this.level >= 4 ? 124 : 100;
      for (let i=0;i<this.parts.length;i++) {
        const p = this.parts[i];
        const a = this.angle + Math.PI*2*i/this.parts.length;
        p.setPosition(player.x + Math.cos(a)*r, player.y + Math.sin(a)*r).setRotation(a + Math.PI/2);
        enemiesInRange(p.x, p.y, 52).forEach(e => {
          const last = this.hitCd.get(e) || 0;
          if (time < last + 330) return;
          this.hitCd.set(e, time);
          damageEnemy(this.scene, e, this.dmg());
          knock(e, player.x, player.y, this.level >= 4 ? 280 : 170);
          ring(this.scene, p.x, p.y, 24, 0x66ffcc);
          if (this.level >= 5) explosion(this.scene, e.x, e.y, 72, this.dmg()*.45);
        });
      }
    }
    mine(time) {
      const cd = this.level >= 2 ? 830 : 1150;
      if (this.ready(time, cd)) {
        this.last = time;
        const a = state.lastMoveAngle + Math.PI + Phaser.Math.FloatBetween(-.6,.6);
        const m = placeMine(this.scene, player.x + Math.cos(a)*Phaser.Math.Between(55,95), player.y + Math.sin(a)*Phaser.Math.Between(55,95), 0xffcc44);
        m.damage = this.dmg();
        m.radius = this.level >= 3 ? 122 : 92;
        m.chain = this.level >= 4;
        m.fire = this.level >= 5;
        this.mines.push(m);
        if (this.mines.length > 12) this.mines.shift()?.destroy(true);
      }
      this.mines = this.mines.filter(m => m.active);
      for (const m of this.mines) {
        if (time < m.armed) continue;
        m.setScale(.95 + Math.sin(time*.012)*.08);
        if (enemiesInRange(m.x, m.y, 56, 1)[0] || (m.fire && time > m.created + 5200)) detonate(this.scene, m);
      }
    }
    ice(time) {
      const cd = this.level >= 3 ? 720 : 920;
      if (!this.ready(time, cd)) return;
      this.last = time;
      const targets = enemiesInRange(player.x, player.y, 750, this.level >= 2 ? 2 : 1);
      for (const e of targets) {
        const b = makeBullet(this.scene, player.x, player.y, 0x9be7ff, 8);
        b.damage = this.dmg();
        b.homing = true;
        b.target = e;
        b.speed = 520;
        b.slow = this.level >= 3 ? .42 : .58;
        b.freeze = this.level >= 4 ? .3 : 0;
        b.iceBurst = this.level >= 5;
      }
    }

    hsBelly(time) {
      const cd = this.level >= 3 ? 520 : 700;
      if (!this.ready(time, cd)) return;
      this.last = time;
      const radius = 96 + this.level * 22;
      const damage = this.dmg();
      bellyPulse(this.scene, player.x, player.y, radius);
      enemiesInRange(player.x, player.y, radius).forEach(e => {
        damageEnemy(this.scene, e, damage);
        if (!e.active) return;
        if (!e.isBoss && e.hp <= damage * (this.level >= 4 ? 1.8 : 1.2)) {
          // 낮은 체력 적은 즉시 흡수 처리. 시각 표현은 비폭력적인 소멸 이펙트로만 표시.
          killEnemy(this.scene, e);
        } else if (e.body) {
          const ang = aTo(e.x, e.y, player.x, player.y);
          e.body.setVelocity(Math.cos(ang) * 135, Math.sin(ang) * 135);
        }
      });
    }

    jjyGlasses(time) {
      if (time < this.last + 240) return;
      this.last = time;
      const radius = 145 + this.level * 25;
      enemiesInRange(player.x, player.y, radius).forEach(e => {
        slow(e, time, 720 + this.level * 130, Math.max(0.32, 0.62 - this.level * 0.055));
        damageEnemy(this.scene, e, this.dmg());
      });
      if (time > (this.last2 || 0) + 850) {
        this.last2 = time;
        ring(this.scene, player.x, player.y, radius, 0xaeefff);
      }
    }

    sausage(time, delta) {
      const count = this.level >= 4 ? 2 : 1;
      while (this.parts.length < count) {
        this.parts.push(this.scene.add.sprite(player.x, player.y, "assetSausage").setDisplaySize(68, 26).setDepth(43));
      }
      this.angle += delta * (0.005 + this.level * 0.00045);
      const radius = 98 + this.level * 9;
      for (let i = 0; i < this.parts.length; i++) {
        const p = this.parts[i];
        const ang = this.angle + Math.PI * 2 * i / this.parts.length;
        p.setPosition(player.x + Math.cos(ang) * radius, player.y + Math.sin(ang) * radius).setRotation(ang + Math.PI / 2);
        enemiesInRange(p.x, p.y, 48).forEach(e => {
          const key = "saus" + i;
          if (time < (e[key] || 0)) return;
          e[key] = time + 260;
          damageEnemy(this.scene, e, this.dmg());
          knock(e, player.x, player.y, 150 + this.level * 24);
          ring(this.scene, p.x, p.y, 22, 0xff8a66);
        });
      }
    }

    anseongWave(time) {
      const cd = this.level >= 4 ? 900 : 1180;
      if (!this.ready(time, cd)) return;
      this.last = time;
      const waves = this.level >= 3 ? 3 : 2;
      for (let i = 0; i < waves; i++) {
        this.scene.time.delayedCall(i * 145, () => {
          areaWave(this.scene, player.x, player.y, 115 + this.level * 38 + i * 52, this.dmg() * (1 - i * 0.12));
        });
      }
    }

    brain(time) {
      if (time < this.last + 1400) return;
      this.last = time;
      const radius = 60 + this.level * 10;
      const halo = this.scene.add.circle(player.x, player.y, radius, 0xff8be8, 0).setStrokeStyle(2, 0xff8be8, 0.35).setDepth(41);
      this.scene.tweens.add({ targets: halo, alpha: 0, scale: 1.25, duration: 430, onComplete: () => halo.destroy() });
    }

    cameraFlash(time) {
      const cd = this.level >= 4 ? 2500 : 3200;
      if (!this.ready(time, cd)) return;
      this.last = time;
      const radius = 210 + this.level * 35;
      cameraFlashEffect(this.scene, radius);
      enemiesInRange(player.x, player.y, radius).forEach(e => {
        e.stunUntil = Math.max(e.stunUntil || 0, time + 2000);
        damageEnemy(this.scene, e, this.dmg());
      });
    }

    stone(time) {
      const cd = this.level >= 3 ? 680 : 900;
      if (!this.ready(time, cd)) return;
      this.last = time;
      const t = nearestEnemy();
      if (!t) return;
      const b = makeAssetProjectile(this.scene, "assetStone", player.x, player.y, 32 + this.level * 3, 0xaab3bd);
      b.damage = this.dmg();
      b.speed = 440 + this.level * 30;
      b.radius = 17 + this.level * 2;
      b.pierce = this.level >= 4 ? 4 : this.level >= 2 ? 2 : 1;
      b.knockPower = 230 + this.level * 35;
      b.roll = true;
      b.life = 2400;
      const ang = aTo(player.x, player.y, t.x, t.y);
      b.body.setVelocity(Math.cos(ang) * b.speed, Math.sin(ang) * b.speed);
    }

    lung(time) {
      const cd = this.level >= 3 ? 760 : 980;
      if (!this.ready(time, cd)) return;
      this.last = time;
      const target = nearestEnemy();
      const angle = target ? aTo(player.x, player.y, target.x, target.y) : state.lastMoveAngle;
      shockwave(this.scene, angle, 220 + this.level * 55, 48 + this.level * 9, this.dmg());
      if (this.level >= 5) {
        this.scene.time.delayedCall(120, () => shockwave(this.scene, angle + 0.18, 210, 42, this.dmg() * 0.55));
        this.scene.time.delayedCall(160, () => shockwave(this.scene, angle - 0.18, 210, 42, this.dmg() * 0.55));
      }
    }

  }

  class Fusion {
    constructor(scene, id) {
      this.scene = scene;
      this.id = id;
      this.last = 0;
      this.last2 = 0;
      this.angle = 0;
      this.parts = [];
      this.mines = [];
    }
    tick(time, delta) {
      if (this.id === "thunderShield") return this.thunderShield(time, delta);
      if (this.id === "gravityMine") return this.gravityMine(time);
      if (this.id === "cryoBeam") return this.cryoBeam(time);
      if (this.id === "stormWeb") return this.stormWeb(time);
      if (this.id === "magicBlade") return this.magicBlade(time);
    }
    thunderShield(time, delta) {
      this.angle += delta*.0052;
      while (this.parts.length < 3) this.parts.push(this.scene.add.sprite(player.x,player.y,"assetShield").setDisplaySize(48,48).setTint(0x66ffff).setDepth(45));
      for (let i=0;i<3;i++) {
        const a = this.angle + Math.PI*2*i/3;
        const p = this.parts[i];
        p.setPosition(player.x+Math.cos(a)*130, player.y+Math.sin(a)*130).setRotation(a+Math.PI/2);
        enemiesInRange(p.x,p.y,62).forEach(e => {
          if (time < (e.thunderHit || 0)) return;
          e.thunderHit = time + 330;
          lightning(this.scene, e.x, e.y);
          damageEnemy(this.scene, e, 6.2);
          e.stunUntil = Math.max(e.stunUntil || 0, time + 520);
        });
      }
      if (time > this.last2 + 1750) {
        this.last2 = time;
        enemiesInRange(player.x, player.y, 850, 5).forEach(e => { lightning(this.scene, e.x, e.y); damageEnemy(this.scene, e, 7.4); });
      }
    }
    gravityMine(time) {
      if (time >= this.last + 1450) {
        this.last = time;
        const t = nearestEnemy();
        const a = t ? aTo(player.x,player.y,t.x,t.y) : state.lastMoveAngle;
        const m = placeMine(this.scene, player.x+Math.cos(a)*175, player.y+Math.sin(a)*175, 0xcf76ff);
        m.damage = 13;
        m.radius = 190;
        m.gravity = true;
        this.mines.push(m);
        if (this.mines.length > 7) this.mines.shift()?.destroy(true);
      }
      this.mines = this.mines.filter(m => m.active);
      for (const m of this.mines) {
        if (time < m.armed) continue;
        enemiesInRange(m.x,m.y,260).forEach(e => {
          if (e.body) {
            const a = aTo(e.x,e.y,m.x,m.y);
            e.body.setVelocity(Math.cos(a)*160, Math.sin(a)*160);
          }
        });
        m.setScale(.95 + Math.sin(time*.015)*.12);
        if (enemiesInRange(m.x,m.y,92,1)[0] || time > m.created + 4400) detonate(this.scene, m);
      }
    }
    cryoBeam(time) {
      if (time < this.last + 720) return;
      this.last = time;
      const t = nearestEnemy();
      if (!t) return;
      const base = aTo(player.x,player.y,t.x,t.y);
      [-.14,0,.14].forEach((off,i) => this.scene.time.delayedCall(i*70, () => beam(this.scene, base+off, 860, 36, 5.8, 0xaeefff, {ice:true})));
    }
    stormWeb(time) {
      if (time < this.last + 720) return;
      this.last = time;
      const targets = enemiesInRange(player.x, player.y, 850, 7);
      targets.forEach((e,i) => this.scene.time.delayedCall(i*50, () => {
        if (!e.active) return;
        lightning(this.scene, e.x,e.y);
        damageEnemy(this.scene, e, 7.3);
        e.stunUntil = Math.max(e.stunUntil || 0, time+520);
        enemiesInRange(e.x,e.y,180,2).forEach(o => { chain(this.scene,e.x,e.y,o.x,o.y,0x66ffff); damageEnemy(this.scene,o,3.1); });
      }));
    }
    magicBlade(time) {
      if (time < this.last + 520) return;
      this.last = time;
      slash(this.scene, player.x, player.y, state.lastMoveAngle, 175, 0xff91ff);
      enemiesInRange(player.x, player.y, 180).forEach(e => damageEnemy(this.scene, e, 8.4));
      for (let i=0;i<3;i++) {
        const t = nearestEnemy();
        if (t) shootBullet(this.scene, t, { color: 0xff91ff, speed: 600, size: 8, damage: 4.4, homing: true, target: t, pierce: 1 });
      }
    }
  }

  function activeEnemies() {
    return enemies.children.entries.filter(e => e.active && !e.dead);
  }

  function enemiesInRange(x, y, r, limit = Infinity) {
    const r2 = r*r;
    const arr = [];
    for (const e of activeEnemies()) {
      const dx = e.x-x, dy = e.y-y;
      const dd = dx*dx+dy*dy;
      if (dd <= r2) {
        if (limit === Infinity) arr.push(e);
        else arr.push({e, dd});
      }
    }
    if (limit === Infinity) return arr;
    arr.sort((a,b)=>a.dd-b.dd);
    return arr.slice(0,limit).map(v=>v.e);
  }

  function nearestEnemy() {
    return enemiesInRange(player.x, player.y, 1200, 1)[0] || null;
  }

  function highestEnemy() {
    const arr = activeEnemies();
    arr.sort((a,b)=>b.hp-a.hp);
    return arr[0] || null;
  }

  function makeBullet(scene, x, y, color, size) {
    const b = scene.add.sprite(x, y, "bulletCore").setTint(color).setDisplaySize(size*2.9, size*2.9).setAlpha(0.96).setDepth(36);
    scene.physics.add.existing(b);
    b.body.setCircle(size, -size/2, -size/2);
    b.radius = size;
    b.birth = scene.time.now;
    b.life = 2500;
    b.damage = 1;
    b.speed = 500;
    bullets.add(b);
    return b;
  }

  function shootBullet(scene, target, opt) {
    if (!target || !target.active) return null;
    const b = makeBullet(scene, player.x, player.y, opt.color, opt.size || 6);
    Object.assign(b, opt);
    const ang = aTo(player.x, player.y, target.x, target.y);
    b.body.setVelocity(Math.cos(ang)*(opt.speed||500), Math.sin(ang)*(opt.speed||500));
    return b;
  }

  function updateBullets(scene, time) {
    const es = activeEnemies();
    bullets.children.entries.slice().forEach(b => {
      if (!b.active) return;
      if (time > b.birth + (b.life||2500)) { b.destroy(); return; }
      if (b.roll) b.rotation += 0.22;
      if (b.homing && b.target && b.target.active) scene.physics.moveToObject(b, b.target, b.speed || 500);
      if (b.trail && Math.random() < .65) trail(scene, b.x, b.y, b.tintTopLeft || 0xffffff, b.radius || 5);
      for (const e of es) {
        if (!b.active || !e.active) continue;
        if (d(b.x,b.y,e.x,e.y) < e.radius + (b.radius||6)) {
          const wasKilled = damageEnemy(scene, e, b.damage || 1);
          if (b.slow && e.active) slow(e, time, 1700, b.slow);
          if (b.freeze && e.active && Math.random() < b.freeze) freeze(e, time, 650);
          if (b.stun && e.active) e.stunUntil = Math.max(e.stunUntil || 0, time + b.stun);
          if (b.knockPower && e.active) knock(e, b.x, b.y, b.knockPower);
          if (b.iceBurst && wasKilled) iceBurst(scene, b.x,b.y,86, b.damage*.55);
          if (b.explode) explosion(scene, b.x,b.y,b.explode,b.damage*.5);
          if (b.pierce && b.pierce > 0) b.pierce--; else b.destroy();
        }
      }
    });
  }

  
  function beam(scene, angle, len, width, damage, color, opt={}) {
    const sx = player.x, sy = player.y;
    const ex = sx + Math.cos(angle) * len, ey = sy + Math.sin(angle) * len;
    const mx = (sx + ex) / 2, my = (sy + ey) / 2;

    const glowWide = scene.add.rectangle(mx, my, len, width * 1.9, color, 0.12).setRotation(angle).setDepth(55);
    const glowMid  = scene.add.rectangle(mx, my, len, width * 1.15, color, 0.22).setRotation(angle).setDepth(56);
    const core     = scene.add.rectangle(mx, my, len, Math.max(6, width * 0.24), 0xffffff, 0.95).setRotation(angle).setDepth(57);

    const startFlash = scene.add.circle(sx, sy, width * 0.9, color, 0.26).setDepth(58);
    const endFlash   = scene.add.circle(ex, ey, width * 0.75, 0xffffff, 0.18).setDepth(58);

    for (let i = 0; i < 11; i++) {
      const t = i / 10;
      const px = sx + (ex - sx) * t + Phaser.Math.Between(-8, 8);
      const py = sy + (ey - sy) * t + Phaser.Math.Between(-8, 8);
      const spark = scene.add.circle(px, py, Phaser.Math.Between(2, 5), color, 0.72).setDepth(59);
      scene.tweens.add({
        targets: spark,
        alpha: 0,
        scale: 0.2,
        y: py + Phaser.Math.Between(-12, 12),
        duration: 160 + Phaser.Math.Between(0, 120),
        onComplete: () => spark.destroy(),
      });
    }

    scene.tweens.add({
      targets: [glowWide, glowMid, core, startFlash, endFlash],
      alpha: 0,
      scaleY: 0.24,
      duration: 200,
      onComplete: () => { glowWide.destroy(); glowMid.destroy(); core.destroy(); startFlash.destroy(); endFlash.destroy(); }
    });

    activeEnemies().forEach(e => {
      if (lineDist(e.x, e.y, sx, sy, ex, ey) < width * 0.9 + e.radius * 0.42) {
        damageEnemy(scene, e, damage);
        if (opt.ice && e.active) {
          slow(e, scene.time.now, 2300, .38);
          if (Math.random() < .28) freeze(e, scene.time.now, 650);
        }
      }
    });
  }


  
  function slash(scene, x, y, angle, radius, color) {
    const arcBack = scene.add.arc(x, y, radius * 1.04, -115, 115, false, color, 0.08)
      .setStrokeStyle(22, color, 0.25).setRotation(angle).setDepth(54);
    const arcMain = scene.add.arc(x, y, radius, -105, 105, false, color, 0.14)
      .setStrokeStyle(12, color, 0.95).setRotation(angle).setDepth(55);

      .setStrokeStyle(4, 0xffffff, 0.88).setRotation(angle).setDepth(56);

    const bladeIcon = scene.add.sprite(
      x + Math.cos(angle) * radius * 0.62,
      y + Math.sin(angle) * radius * 0.62,
      "assetBlade"
    ).setDisplaySize(58, 58).setRotation(angle + Math.PI / 2).setDepth(57);

    const slashGlow = scene.add.circle(
      x + Math.cos(angle) * radius * 0.48,
      y + Math.sin(angle) * radius * 0.48,

    ).setDepth(54);

    scene.tweens.add({

    });

    scene.cameras.main.shake(90, .0032);

  function lightning(scene, x, y) {
    const topY = y - Phaser.Math.Between(280, 380);
    const points = [];
    const segments = 9;
    for (let i = 0; i <= segments; i++) {
      const t = i / segments;
      points.push({
        x: x + (i === 0 || i === segments ? 0 : Phaser.Math.Between(-26, 26)),
        y: topY + (y - topY) * t
      });
    }

    const glow = scene.add.graphics().setDepth(65);
    const core = scene.add.graphics().setDepth(66);

    const draw = (g, width, c, a) => {
      g.lineStyle(width, c, a);
      g.beginPath();
      g.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) g.lineTo(points[i].x, points[i].y);
      g.strokePath();
    };

    draw(glow, 18, 0x66d9ff, 0.18);
    draw(core, 5, 0xeaffff, 0.96);

    for (let i = 2; i < points.length - 1; i += 2) {
      const p = points[i];
      const g = scene.add.graphics().setDepth(66);
      const bx = p.x + Phaser.Math.Between(-56, 56);
      const by = p.y + Phaser.Math.Between(24, 70);
      g.lineStyle(2, 0xcff7ff, 0.82);
      g.beginPath();
      g.moveTo(p.x, p.y);
      g.lineTo((p.x + bx) / 2 + Phaser.Math.Between(-12, 12), (p.y + by) / 2);
      g.lineTo(bx, by);
      g.strokePath();
      scene.tweens.add({ targets: g, alpha: 0, duration: 130, onComplete: () => g.destroy() });
    }

    const impactGlow = scene.add.circle(x, y, 62, 0x66d9ff, 0.22).setDepth(64);
    const impactCore = scene.add.circle(x, y, 24, 0xffffff, 0.55).setDepth(67);
    const impactRing = scene.add.circle(x, y, 24, 0xffffff, 0).setStrokeStyle(4, 0xcff7ff, 0.95).setDepth(67);

    scene.tweens.add({ targets: [glow, core], alpha: 0, duration: 150, onComplete: () => { glow.destroy(); core.destroy(); } });
    scene.tweens.add({ targets: impactGlow, alpha: 0, scale: 1.7, duration: 220, onComplete: () => impactGlow.destroy() });
    scene.tweens.add({ targets: impactCore, alpha: 0, scale: 2.1, duration: 180, onComplete: () => impactCore.destroy() });
    scene.tweens.add({ targets: impactRing, alpha: 0, scale: 2.2, duration: 260, onComplete: () => impactRing.destroy() });
  }


  function gravity(scene, x, y, radius, duration, damage) {
    const core = scene.add.circle(x,y,30,0x020006,1).setStrokeStyle(5,0xa06bff,.9).setDepth(61);
    const field = scene.add.circle(x,y,radius,0xa06bff,.08).setStrokeStyle(3,0xa06bff,.5).setDepth(60);
    let elapsed=0;
    const ev = scene.time.addEvent({delay:90,loop:true,callback:()=>{
      elapsed += 90;
      enemiesInRange(x,y,radius).forEach(e=>{
        if (e.body) {
          const ang=aTo(e.x,e.y,x,y);
          e.body.setVelocity(Math.cos(ang)*145,Math.sin(ang)*145);
        }
        damageEnemy(scene,e,damage*.12);
      });
      core.setScale(1+Math.sin(elapsed*.02)*.1);
      if (elapsed >= duration) {
        ev.destroy();
        explosion(scene,x,y,radius*.78,damage*1.05);
        scene.tweens.add({targets:[core,field],alpha:0,scale:1.35,duration:280,onComplete:()=>{core.destroy();field.destroy();}});
      }
    }});
  }

  
  function explosion(scene, x, y, radius, damage, opt={}) {
    const baseColor = opt.fire ? 0xff5522 : 0xff8844;
    const warmColor = opt.fire ? 0xffdd66 : 0xfff0cc;

    const outer = scene.add.circle(x, y, radius, baseColor, 0.10).setStrokeStyle(6, warmColor, 0.55).setDepth(58);
    const inner = scene.add.circle(x, y, radius * 0.62, warmColor, 0.20).setDepth(59);
    const shock = scene.add.circle(x, y, radius * 0.2, 0xffffff, 0.08).setStrokeStyle(3, 0xffffff, 0.9).setDepth(60);

    for (let i = 0; i < 18; i++) {
      const ang = Phaser.Math.FloatBetween(0, Math.PI * 2);
      const dist = Phaser.Math.FloatBetween(radius * 0.2, radius * 0.95);
      const p = scene.add.circle(x + Math.cos(ang) * dist, y + Math.sin(ang) * dist, Phaser.Math.Between(2, 6), warmColor, 0.85).setDepth(61);
      scene.tweens.add({
        targets: p,
        x: p.x + Math.cos(ang) * Phaser.Math.Between(18, 54),
        y: p.y + Math.sin(ang) * Phaser.Math.Between(18, 54),
        alpha: 0,
        scale: 0.2,
        duration: 220 + Phaser.Math.Between(0, 140),
        onComplete: () => p.destroy()
      });
    }

    scene.tweens.add({
      targets: outer,
      alpha: 0,
      scale: 1.38,
      duration: 300,
      ease: "Cubic.easeOut",
      onComplete: () => outer.destroy()
    });
    scene.tweens.add({
      targets: inner,
      alpha: 0,
      scale: 1.65,
      duration: 240,
      ease: "Cubic.easeOut",
      onComplete: () => inner.destroy()
    });
    scene.tweens.add({
      targets: shock,
      alpha: 0,
      scale: 2.3,
      duration: 260,
      onComplete: () => shock.destroy()
    });

    enemiesInRange(x, y, radius).forEach(e => {
      damageEnemy(scene, e, damage);
      if (opt.fire && e.active) {
        e.burnUntil = Math.max(e.burnUntil || 0, scene.time.now + 1600);
        e.burnDmg = Math.max(e.burnDmg || 0, damage * 0.08);
      }
    });

    scene.cameras.main.shake(120, .0045);
  }


  function placeMine(scene,x,y,color) {
    const c = scene.add.container(x,y).setDepth(27);
    const glow = scene.add.circle(0,0,24,color,.16).setStrokeStyle(2,color,.45);
    const icon = scene.add.sprite(0,0,"assetMine").setDisplaySize(42,42).setTint(color);
    c.add([glow,icon]);
    c.created = scene.time.now;
    c.armed = scene.time.now + 250;
    c.radius = 100;
    c.damage = 4;
    return c;
  }

  function detonate(scene,m) {
    if (!m.active) return;
    const x=m.x,y=m.y;
    m.destroy(true);
    if (m.gravity) gravity(scene,x,y,m.radius*1.15,520,m.damage);
    else explosion(scene,x,y,m.radius,m.damage,{fire:m.fire});
    if (m.chain) enemiesInRange(x,y,m.radius*1.6,4).forEach((e,i)=>scene.time.delayedCall(i*75,()=>e.active&&explosion(scene,e.x,e.y,m.radius*.45,m.damage*.35)));
  }

  
  function chain(scene, x1, y1, x2, y2, color) {
    const back = scene.add.line(0, 0, x1, y1, x2, y2, color, 0.16).setOrigin(0).setLineWidth(10).setDepth(53);
    const mid  = scene.add.line(0, 0, x1, y1, x2, y2, color, 0.35).setOrigin(0).setLineWidth(5).setDepth(54);
    const core = scene.add.line(0, 0, x1, y1, x2, y2, 0xffffff, 0.95).setOrigin(0).setLineWidth(2).setDepth(55);
    scene.tweens.add({ targets: [back, mid, core], alpha: 0, duration: 190, onComplete: () => { back.destroy(); mid.destroy(); core.destroy(); } });
  }


  
  function ring(scene, x, y, r, color) {
    const rr = scene.add.circle(x, y, r, color, 0.08).setStrokeStyle(3, 0xffffff, 0.72).setDepth(57);
    const glow = scene.add.circle(x, y, r * 0.72, color, 0.12).setDepth(56);
    scene.tweens.add({
      targets: [rr, glow],
      alpha: 0,
      scale: 1.9,
      duration: 220,
      ease: "Cubic.easeOut",
      onComplete: () => { rr.destroy(); glow.destroy(); }
    });
  }


  
  function trail(scene, x, y, color, size) {
    const t = scene.add.circle(x, y, size, color, 0.18).setDepth(23);
    const core = scene.add.circle(x, y, Math.max(1, size * 0.38), 0xffffff, 0.45).setDepth(24);
    scene.tweens.add({
      targets: [t, core],
      alpha: 0,
      scale: 0.18,
      duration: 190,
      onComplete: () => { t.destroy(); core.destroy(); }
    });
  }


  function iceBurst(scene,x,y,r,damage) {

    if (tint) b.setTint(tint);

  function bellyPulse(scene, x, y, radius) {
    const aura = scene.add.circle(x, y, radius, 0xffbf5a, 0.10).setStrokeStyle(4, 0xffdf91, 0.70).setDepth(58);
    const core = scene.add.sprite(x, y, "assetHsBelly").setDisplaySize(54, 54).setDepth(59);
    scene.tweens.add({ targets: [aura, core], alpha: 0, scale: 1.32, duration: 300, onComplete: () => { aura.destroy(); core.destroy(); } });

  function areaWave(scene, x, y, radius, damage) {
    const wave = scene.add.circle(x, y, radius, 0x55d6ff, 0).setStrokeStyle(5, 0x55d6ff, 0.62).setDepth(56);

  function cameraFlashEffect(scene, radius) {
    const flash = scene.add.rectangle(0, 0, scene.scale.width, scene.scale.height, 0xfff6aa, 0.20).setOrigin(0).setScrollFactor(0).setDepth(2100);
    const ringObj = scene.add.circle(player.x, player.y, radius, 0xfff26b, 0).setStrokeStyle(5, 0xfff26b, 0.72).setDepth(60);
    scene.tweens.add({ targets: flash, alpha: 0, duration: 160, onComplete: () => flash.destroy() });

  function shockwave(scene, angle, length, width, damage) {
    const sx = player.x;
    const sy = player.y;
    const ex = sx + Math.cos(angle) * length;
    const ey = sy + Math.sin(angle) * length;
    const wave = scene.add.rectangle((sx + ex) / 2, (sy + ey) / 2, length, width, 0xff798a, 0.18).setRotation(angle).setDepth(57);
    const core = scene.add.sprite(sx + Math.cos(angle) * 42, sy + Math.sin(angle) * 42, "assetLung").setDisplaySize(42, 42).setRotation(angle).setDepth(58);
    scene.tweens.add({ targets: [wave, core], alpha: 0, scaleY: 1.75, duration: 260, onComplete: () => { wave.destroy(); core.destroy(); } });

  function knock(e, fromX, fromY, power) {
    if (!e.body) return;
    const ang = aTo(fromX,fromY,e.x,e.y);
    e.body.setVelocity(Math.cos(ang)*power, Math.sin(ang)*power);
  }

  function slow(e,time,duration,mult) {
    e.slowUntil = Math.max(e.slowUntil||0, time+duration);
    e.slowMult = Math.min(e.slowMult||1, mult);
    e.setTint(0xaeefff);
  }

  function freeze(e,time,duration) {
    e.freezeUntil = Math.max(e.freezeUntil||0, time+duration);
    e.stunUntil = Math.max(e.stunUntil||0, time+duration);
    e.setTint(0xeaffff);
    if (e.body) e.body.setVelocity(0,0);
  }

  function activeStage() {
    for (const s of STAGES) if (state.elapsed >= s.from && state.elapsed < s.to) return s;
    return STAGES[STAGES.length-1];
  }

  function pickEnemyType() {
    const pool = state.stage.pool;
    const weighted = [];
    pool.forEach(id=>{
      const t = ENEMIES[id];
      let w = t.weight;
      if (state.elapsed < 120 && ["charger","shocker","voidling","brute"].includes(id)) w *= state.diff.spawn >= 2 ? .65 : .42;
      if (state.elapsed > 240 && ["charger","voidling","brute"].includes(id)) w *= 1.75;
      if (state.diff.spawn >= 2.5 && ["runner","charger","shocker"].includes(id)) w *= 1.45;
      for (let i=0;i<Math.max(1,Math.round(w));i++) weighted.push(id);
    });
    return Phaser.Utils.Array.GetRandom(weighted);
  }

  function spawnEnemy(scene, id=null, x=null, y=null, opt={}) {
    if (activeEnemies().length >= state.diff.cap) return null;

    const boss = opt.boss ? BOSSES[opt.boss] : null;
    const def = boss || ENEMIES[id || pickEnemyType()];

    if (x === null || y === null) {
      const ang = Phaser.Math.FloatBetween(0,Math.PI*2);
      const dist = opt.close ? Phaser.Math.Between(430,720) : Phaser.Math.Between(860,1250);
      x = player.x + Math.cos(ang)*dist;
      y = player.y + Math.sin(ang)*dist;
    }

    const s = scene.add.sprite(x,y,def.tex).setDepth(boss?34:30);
    s.setDisplaySize(def.r*2.6, def.r*2.6);
    scene.physics.add.existing(s);
    s.body.setCircle(def.r, s.width/2-def.r, s.height/2-def.r);
    s.radius = def.r;
    s.type = def;
    s.typeId = id || "grunt";
    s.isBoss = !!boss;
    s.bossId = opt.boss || null;
    s.bossPattern = def.pattern;
    s.maxHp = Math.round((boss ? def.hp + state.elapsed*1.6 : state.baseEnemyHp*def.hp) * state.stage.hp * (boss ? state.diff.boss : state.diff.hp));
    s.hp = s.maxHp;
    s.speed = def.speed;
    s.dmg = def.dmg;
    s.expValue = boss ? 28 + state.stageIndex*8 : def.exp;
    s.nextSpecial = 0;
    s.nextBoss = scene.time.now + 1500;
    enemies.add(s);

    if (boss) {
      state.activeBoss = s;
      centerText(scene, "BOSS  " + def.label, "#ffdd66");
    }
    return s;
  }

  function updateEnemies(scene,time) {
    activeEnemies().forEach(e=>{
      if (!e.body) return;

      if (e.stunUntil && e.stunUntil > time) {
        e.body.setVelocity(0,0);
        return;
      }

      if (e.isBoss) updateBoss(scene,e,time);
      else updateEnemySkill(scene,e,time);

      if (e.overrideUntil && e.overrideUntil > time) return;

      const slowMult = e.slowUntil && e.slowUntil > time ? (e.slowMult||.55) : 1;
      if (!e.slowUntil || e.slowUntil <= time) e.clearTint();
      const pressure = Math.min(1.3,1+state.elapsed/1500);
      const speed = e.speed * state.diff.speed * state.stage.hp**0.08 * slowMult * pressure * (e.isBoss ? .78 : 1);
      scene.physics.moveToObject(e, player, speed);
      e.rotation = Phaser.Math.Angle.RotateTo(e.rotation, aTo(e.x,e.y,player.x,player.y), .08);
    });
  }

  function updateEnemySkill(scene,e,time) {
    if (time < e.nextSpecial) return;
    const t = e.type;
    if (t.charge) {
      e.nextSpecial = time + Phaser.Math.Between(1900,2800);
      e.overrideUntil = time + 420;
      const ang = aTo(e.x,e.y,player.x,player.y);
      e.body.setVelocity(Math.cos(ang)*330, Math.sin(ang)*330);
      warningRing(scene,e.x,e.y,48,0xffdd55);
    } else if (t.shock) {
      e.nextSpecial = time + Phaser.Math.Between(2500,3800);
      if (d(e.x,e.y,player.x,player.y) < 360) {
        lightning(scene,player.x,player.y);
        hitPlayer(scene,4.3*state.diff.dmg);
      }
    } else if (t.void) {
      e.nextSpecial = time + Phaser.Math.Between(3000,4300);
      warningRing(scene,e.x,e.y,135,0xa06bff,()=> {
        if (d(e.x,e.y,player.x,player.y) < 135) {
          hitPlayer(scene,4.2*state.diff.dmg);
          const ang = aTo(player.x,player.y,e.x,e.y);
          player.body.setVelocity(Math.cos(ang)*250,Math.sin(ang)*250);
        }
      });
    } else {
      e.nextSpecial = time + 999999;
    }
  }

  function updateBoss(scene,e,time) {
    if (time < e.nextBoss) return;
    e.nextBoss = time + Phaser.Math.Between(1900,3000);
    const p = e.bossPattern === "king" ? Phaser.Utils.Array.GetRandom(["slam","storm","pull"]) : e.bossPattern;
    if (p === "slam") {
      warningRing(scene,e.x,e.y,230,0xff315a,()=> {
        explosion(scene,e.x,e.y,230,7);
        if (d(e.x,e.y,player.x,player.y)<230) hitPlayer(scene,11*state.diff.dmg);
      });
    } else if (p === "storm") {
      for (let i=0;i<7;i++) scene.time.delayedCall(i*120,()=> {
        const ang=Phaser.Math.FloatBetween(0,Math.PI*2), dd=Phaser.Math.Between(80,430);
        const x=player.x+Math.cos(ang)*dd, y=player.y+Math.sin(ang)*dd;
        warningRing(scene,x,y,52,0x66d9ff,()=>{lightning(scene,x,y); if(d(x,y,player.x,player.y)<62) hitPlayer(scene,6.4*state.diff.dmg);});
      });
    } else if (p === "pull") {
      gravity(scene,e.x,e.y,320,1200,6);
    }
  }

  function damageEnemy(scene,e,amount) {
    if (!e || !e.active || e.dead) return false;
    e.hp -= e.isBoss ? amount*.78 : amount;
    hitFlash(scene,e.x,e.y);
    if (e.hp <= 0) {
      killEnemy(scene,e);
      return true;
    }
    return false;
  }

  function killEnemy(scene,e) {
    if (!e.active || e.dead) return;
    e.dead = true;
    state.kills++;
    ring(scene,e.x,e.y,e.isBoss?70:30,e.isBoss?0xffdd66:0xff3866);
    if (e.type?.split && !e.isBoss) {
      for (let i=0;i<2;i++) {
        const ang=Phaser.Math.FloatBetween(0,Math.PI*2);
        spawnEnemy(scene,"splitling",e.x+Math.cos(ang)*30,e.y+Math.sin(ang)*30,{close:true});
      }
    }
    for (let i=0;i<Math.max(1,e.expValue||1);i++) spawnOrb(scene,e.x+Phaser.Math.Between(-16,16),e.y+Phaser.Math.Between(-16,16),state.diff.exp);
    if (e.isBoss) {
      state.activeBoss = null;
      centerText(scene,"BOSS DEFEATED","#ffdd66");
      for (let i=0;i<24;i++) spawnOrb(scene,e.x+Phaser.Math.Between(-120,120),e.y+Phaser.Math.Between(-120,120),state.diff.exp);
    }
    e.destroy();
  }

  function hitFlash(scene,x,y) {
    const f=scene.add.circle(x,y,12,0xffffff,.42).setDepth(66);
    scene.tweens.add({targets:f,alpha:0,scale:1.8,duration:90,onComplete:()=>f.destroy()});
  }

  function spawnOrb(scene,x,y,amount) {
    const o=scene.add.circle(x,y,7,0x66d9ff,.95).setDepth(29);
    scene.physics.add.existing(o);
    o.amount = (amount || 1) * brainExpMultiplier();
    orbs.add(o);
  }

  function updateOrbs(scene) {
    orbs.children.entries.slice().forEach(o=>{
      if (!o.active) return;
      const dd=d(o.x,o.y,player.x,player.y);
      if (dd < 210) scene.physics.moveToObject(o,player,280+(210-dd)*2.2);
      if (dd < 26) {
        state.exp += o.amount;
        o.destroy();
        if (state.exp >= state.need) levelUp(scene);
      }
    });
  }

  function levelUp(scene) {
    if (state.choosing || state.dead) return;
    state.exp -= state.need;
    state.level++;
    state.need = Math.floor(state.need*1.22+4);
    state.choosing = true;
    scene.physics.pause();
    showChoiceDom(scene, manager.options());
  }


  function optionAssetKey(opt) {
    if (opt.asset) return opt.asset;
    if (opt.id === "heal") return "assetHeal";
    const fusion = FUSIONS.find(f => f.id === opt.id);
    if (fusion && fusion.asset) return fusion.asset;
    const weapon = WEAPONS.find(w => w.id === opt.id);
    return weapon && weapon.asset ? weapon.asset : null;
  }

  function showChoiceDom(scene, opts) {
    const layer = document.getElementById("choiceLayer");
    const grid = document.getElementById("choiceGrid");
    document.getElementById("choiceTitle").textContent = "LEVEL " + state.level;
    grid.innerHTML = "";
    opts.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "card" + (opt.type === "fusion" ? " fusion" : "");
      btn.style.borderColor = opt.color;
      const tag = opt.type === "fusion" ? "FUSION" : opt.type === "upgrade" ? `UPGRADE Lv.${opt.next}` : opt.type === "heal" ? "RECOVER" : "NEW";
      const assetKey = optionAssetKey(opt);
      const img = assetKey && WEAPON_ASSET_DATA[assetKey] ? `<img class="asset-icon" src="${WEAPON_ASSET_DATA[assetKey]}" alt="">` : "";
      btn.innerHTML = `${img}<div class="tag">${tag}</div><div class="name">${opt.name}</div><div class="desc">${opt.desc}</div>`;
      btn.addEventListener("click", () => {
        if (opt.type === "fusion") manager.addFusion(opt.id);
        else if (opt.type === "heal") state.hp = Math.min(state.maxHp, state.hp + 35);
        else manager.addWeapon(opt.id);
        layer.style.display = "none";
        grid.innerHTML = "";
        state.choosing = false;
        scene.physics.resume();
      }, { once: true });
      grid.appendChild(btn);
    });
    layer.style.display = "flex";
  }

  function hitPlayer(scene, amount) {
    if (state.dead || !state.started || state.choosing) return;
    state.hp -= amount;
    player.setTint(0xff8888);
    scene.time.delayedCall(90,()=>player.clearTint());
    if (state.hp <= 0) {
      state.hp = 0;
      gameOver(scene);
    }
  }

  function updateContact(scene, delta) {
    let dps=0;
    activeEnemies().forEach(e=>{
      if (d(e.x,e.y,player.x,player.y) < e.radius+20) dps += 12*(e.dmg||1)*(e.isBoss?1.8:1)*state.diff.dmg;
    });
    if (dps>0) hitPlayer(scene, Math.min(dps,44)*delta/1000);
  }

  function gameOver(scene) {
    if (state.dead) return;
    state.dead = true;
    scene.physics.pause();
    const layer = document.getElementById("choiceLayer");
    const grid = document.getElementById("choiceGrid");
    document.getElementById("choiceTitle").textContent = "GAME OVER";
    grid.innerHTML = `<button class="card selected" id="restartBtn"><div class="tag">RESULT</div><div class="name">Lv.${state.level} · ${state.kills} Kills · ${fmt(state.elapsed)}</div><div class="desc">눌러서 다시 시작</div></button>`;
    layer.style.display = "flex";
    document.getElementById("restartBtn").addEventListener("click",()=>location.reload(),{once:true});
  }

  function warningRing(scene,x,y,r,color,done) {
    const m=scene.add.circle(x,y,r,color,.02).setStrokeStyle(3,color,.75).setDepth(63);
    scene.tweens.add({targets:m,scale:{from:.4,to:1.15},alpha:{from:.85,to:.05},duration:380,onComplete:()=>{m.destroy();done&&done();}});
  }

  function centerText(scene,text,color="#00ffd5") {
    const t=scene.add.text(scene.scale.width/2,scene.scale.height*.28,text,{fontSize:scene.scale.width<640?"24px":"36px",color,fontStyle:"900",letterSpacing:4,shadow:{blur:18,color,fill:true}}).setOrigin(.5).setScrollFactor(0).setDepth(2000);
    scene.tweens.add({targets:t,y:"-=24",alpha:0,duration:1600,onComplete:()=>t.destroy()});
  }

  function spawnLoop(scene, delta) {
    const pressure = 1 + Math.min(1.75, state.elapsed / 430);
    const burstPressure = state.elapsed > 180 ? 1.18 : 1.0;
    const every = Math.max(42, 340 / (state.diff.spawn * state.stage.spawn * pressure * burstPressure));
    state.spawnAcc += delta;
    if (state.spawnAcc >= every) {
      state.spawnAcc = 0;
      const count = Math.min(22, 2 + Math.floor(state.elapsed / 65) + Math.floor(state.stageIndex * 1.5));
      for (let i = 0; i < count; i++) spawnEnemy(scene);
    }
    if (state.elapsed>0 && state.elapsed%45===0 && scene.minuteWarn !== state.elapsed) {
      scene.minuteWarn = state.elapsed;
      centerText(scene,"HORDE INCOMING","#ff4455");
      scene.time.delayedCall(900,()=>{for(let i=0;i<32+state.stageIndex*12;i++) spawnEnemy(scene,null,null,null,{close:true});});
    }
  }

  function updateStage(scene,time) {
    state.elapsed = Math.floor((time - state.startTime)/1000);
    const old = state.stageIndex;
    state.stage = activeStage();
    state.stageIndex = STAGES.indexOf(state.stage);
    if (old !== state.stageIndex) {
      centerText(scene, "STAGE " + (state.stageIndex+1) + " — " + state.stage.name);
      scene.cameras.main.setBackgroundColor(state.stage.tint);
    }
    if (state.stage.boss && state.elapsed >= state.stage.bossAt) {
      const key = state.stage.name + state.stage.boss;
      if (!state.bossSpawned.has(key)) {
        state.bossSpawned.add(key);
        spawnEnemy(scene,null,null,null,{boss:state.stage.boss});
      }
    }
  }

  function createPlayer(scene) {
    player = scene.add.sprite(0,0,(state.playerTextureKey || "playerShip")).setDisplaySize(64,64).setDepth(40);
    scene.physics.add.existing(player);
    player.body.setCircle(22, player.width/2-22, player.height/2-22);
    // FIX V6: Phaser Sprite에는 setDamping()이 없다. 잘못 호출하면 시작 화면에서 멈춘다.
    if (player.body && typeof player.body.setDamping === "function") {
      player.body.setDamping(true);
    }
  }

  function movePlayer(scene) {
    const v = new Phaser.Math.Vector2(0,0);
    if (keys.left.isDown || keys.a.isDown) v.x -= 1;
    if (keys.right.isDown || keys.d.isDown) v.x += 1;
    if (keys.up.isDown || keys.w.isDown) v.y -= 1;
    if (keys.down.isDown || keys.s.isDown) v.y += 1;
    if (state.joystick.lengthSq() > .01) v.add(state.joystick);
    if (v.lengthSq() > 0) {
      v.normalize();
      state.lastMoveAngle = Math.atan2(v.y,v.x);
      if (state.playerTextureKey === "playerCustom") {
        player.rotation = 0;
        player.setFlipX(v.x < -0.08);
      } else {
        player.setFlipX(false);
        player.rotation = Phaser.Math.Angle.RotateTo(player.rotation,state.lastMoveAngle,.18);
      }
      player.body.setVelocity(v.x*245,v.y*245);
      if (Math.random()<.35) trail(scene,player.x-Math.cos(state.lastMoveAngle)*26,player.y-Math.sin(state.lastMoveAngle)*26,0x00ffd5,10);
    } else {
      player.body.setVelocity(0,0);
      if (state.playerTextureKey === "playerCustom") player.rotation = 0;
    }
  }

  function createBackground(scene) {
    for (let i=0;i<320;i++) {
      const s=scene.add.circle(Phaser.Math.Between(-1700,1700),Phaser.Math.Between(-1700,1700),Phaser.Math.FloatBetween(1,2.5),0x7ecfc0,Phaser.Math.FloatBetween(.08,.34)).setDepth(-100);
      bgStars.push(s);
    }
    for (let i=0;i<9;i++) {
      const n=scene.add.circle(Phaser.Math.Between(-1300,1300),Phaser.Math.Between(-1300,1300),Phaser.Math.Between(160,340),i%2?0x14234a:0x2a1244,.07).setDepth(-101);
      bgStars.push(n);
    }
  }

  function updateBackground(scene) {
    const cam=scene.cameras.main;
    const cx=cam.scrollX+scene.scale.width/2, cy=cam.scrollY+scene.scale.height/2;
    bgStars.forEach(s=>{
      if(s.x<cx-1900)s.x+=3800;if(s.x>cx+1900)s.x-=3800;
      if(s.y<cy-1900)s.y+=3800;if(s.y>cy+1900)s.y-=3800;
    });
  }

  function createUi(scene) {
    ui.level=scene.add.text(16,12,"Lv.1",{fontSize:"22px",color:"#fff",fontStyle:"bold"}).setScrollFactor(0).setDepth(1000);
    ui.stage=scene.add.text(scene.scale.width/2,14,"",{fontSize:"13px",color:"#8df7ff",fontStyle:"bold"}).setOrigin(.5,0).setScrollFactor(0).setDepth(1000);
    ui.time=scene.add.text(scene.scale.width-16,12,"00:00",{fontSize:"16px",color:"#d8deea"}).setOrigin(1,0).setScrollFactor(0).setDepth(1000);
    ui.weapons=scene.add.text(16,44,"",{fontSize:"12px",color:"#aab8c8",wordWrap:{width:Math.min(540,scene.scale.width-32)}}).setScrollFactor(0).setDepth(1000);
    ui.hpBg=scene.add.rectangle(16,scene.scale.height-30,190,12,0x330000,.72).setOrigin(0).setScrollFactor(0).setDepth(1000);
    ui.hp=scene.add.rectangle(16,scene.scale.height-30,190,12,0x44ff66,.92).setOrigin(0).setScrollFactor(0).setDepth(1001);
    ui.expBg=scene.add.rectangle(16,scene.scale.height-12,scene.scale.width-32,6,0x111827,.9).setOrigin(0).setScrollFactor(0).setDepth(1000);
    ui.exp=scene.add.rectangle(16,scene.scale.height-12,0,6,0x66d9ff,.95).setOrigin(0).setScrollFactor(0).setDepth(1001);
    ui.bossText=scene.add.text(scene.scale.width/2,scene.scale.height-62,"",{fontSize:"13px",color:"#ffdd66",fontStyle:"bold"}).setOrigin(.5).setScrollFactor(0).setDepth(1002).setVisible(false);
    ui.bossBg=scene.add.rectangle(scene.scale.width/2-220,scene.scale.height-44,440,10,0x332211,.8).setOrigin(0).setScrollFactor(0).setDepth(1000).setVisible(false);
    ui.boss=scene.add.rectangle(scene.scale.width/2-220,scene.scale.height-44,440,10,0xffdd66,.95).setOrigin(0).setScrollFactor(0).setDepth(1001).setVisible(false);
    createJoystick(scene);
  }

  function updateWeaponUi() {
    if (!ui.weapons || !manager) return;
    const w = manager.weapons.map(x => `${WEAPONS.find(a=>a.id===x.id)?.name || x.id}${x.level}`).join("  ");
    const f = manager.fusions.map(x => `[${FUSIONS.find(a=>a.id===x.id)?.name || x.id}]`).join("  ");
    ui.weapons.setText(w + (f ? "\n" + f : ""));
  }

  function updateUi(scene) {
    ui.level.setText(`Lv.${state.level}`);
    ui.stage.setText(`STAGE ${state.stageIndex+1} ${state.stage.name} · ${state.diff.name}`);
    ui.time.setText(fmt(state.elapsed));
    const hpRatio = clamp(state.hp/state.maxHp,0,1);
    ui.hp.width = 190*hpRatio;
    ui.hp.setFillStyle(hpRatio<.3?0xff4455:hpRatio<.6?0xffcc44:0x44ff66);
    ui.exp.width = (scene.scale.width-32)*clamp(state.exp/state.need,0,1);

    if (state.activeBoss && state.activeBoss.active) {
      const b=state.activeBoss, ratio=clamp(b.hp/b.maxHp,0,1), w=Math.min(440,scene.scale.width-40), x=scene.scale.width/2-w/2;
      ui.bossText.setVisible(true).setPosition(scene.scale.width/2,scene.scale.height-62).setText(`${b.type.label}  ${Math.ceil(Math.max(0,b.hp))}/${b.maxHp}`);
      ui.bossBg.setVisible(true).setPosition(x,scene.scale.height-44).setSize(w,10);
      ui.boss.setVisible(true).setPosition(x,scene.scale.height-44).setSize(w*ratio,10);
    } else {
      ui.bossText.setVisible(false); ui.bossBg.setVisible(false); ui.boss.setVisible(false);
    }
  }

  function createJoystick(scene) {
    let baseX = 0, baseY = 0;
    joyBase = scene.add.circle(0,0,60,0xffffff,.065).setStrokeStyle(2,0x9fb8c8,.32).setScrollFactor(0).setDepth(1100).setVisible(false);
    joyKnob = scene.add.circle(0,0,24,0x00ffd5,.28).setStrokeStyle(2,0x00ffd5,.58).setScrollFactor(0).setDepth(1101).setVisible(false);

    const resetStick = () => {
      activeTouchId = null;
      state.joystick.set(0,0);
      joyBase.setVisible(false);
      joyKnob.setVisible(false);
    };

    scene.input.on("pointerdown", p => {
      if (state.choosing || state.dead) return;
      // FIX V6: 화면 어디를 터치하든 그 위치가 조이스틱 중심이 된다.
      activeTouchId = p.id;
      baseX = p.x;
      baseY = p.y;
      joyBase.setPosition(baseX, baseY).setVisible(true);
      joyKnob.setPosition(baseX, baseY).setVisible(true);
      state.joystick.set(0,0);
    });

    scene.input.on("pointerup", p => {
      if (p.id === activeTouchId) resetStick();
    });

    scene.input.on("pointermove", p => {
      if (p.id !== activeTouchId) return;
      const dx = p.x - baseX;
      const dy = p.y - baseY;
      const len = Math.hypot(dx, dy);
      const max = 54;
      const nx = len ? dx / len : 0;
      const ny = len ? dy / len : 0;
      const mag = Math.min(max, len);
      joyKnob.setPosition(baseX + nx * mag, baseY + ny * mag);
      state.joystick.set(nx * Math.min(1, len / max), ny * Math.min(1, len / max));
    });

    scene.input.on("pointerout", p => {
      if (p.id === activeTouchId) resetStick();
    });

    scene.input.on("pointercancel", p => {
      if (p.id === activeTouchId) resetStick();
    });
  }

  function fmt(sec) {
    const m=String(Math.floor(sec/60)).padStart(2,"0");
    const s=String(sec%60).padStart(2,"0");
    return `${m}:${s}`;
  }

  function setupStartDom(scene) {
    const layer = document.getElementById("startLayer");
    const grid = document.getElementById("difficultyGrid");
    grid.innerHTML = "";
    const bootError = document.getElementById("bootError");
    if (bootError) bootError.style.display = "none";
    Object.entries(DIFFS).forEach(([id,diff])=>{
      const btn=document.createElement("button");
      btn.className="card"+(id===state.diffId?" selected":"");
      btn.dataset.id=id;
      btn.innerHTML=`<div class="tag">${diff.name}</div><div class="name">${diff.name}</div><div class="desc">${diff.sub}</div>`;
      btn.addEventListener("click",()=>{
        state.diffId=id; state.diff=diff;
        [...grid.children].forEach(c=>c.classList.remove("selected"));
        btn.classList.add("selected");
      });
      grid.appendChild(btn);
    });

    const fileInput = document.getElementById("playerPhotoInput");
    const resetBtn = document.getElementById("avatarResetButton");
    if (fileInput && !fileInput.dataset.bound) {
      fileInput.dataset.bound = "1";
      fileInput.addEventListener("change", (ev) => {
        const file = ev.target.files && ev.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const dataUrl = buildPixelAvatarDataUrl(img, 20, 64);
            applyCustomPlayerTexture(scene, dataUrl);
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }
    if (resetBtn && !resetBtn.dataset.bound) {
      resetBtn.dataset.bound = "1";
      resetBtn.addEventListener("click", () => resetCustomPlayerTexture(scene));
    }

    updateAvatarPreviewDom();
    document.getElementById("startButton").onclick = () => {
      layer.style.display="none";
      startRun(scene);
    };
    layer.style.display="flex";
  }

  function startRun(scene) {
    state.started=true;
    state.dead=false;
    state.choosing=false;
    state.startTime=scene.time.now;
    state.elapsed=0;
    state.hp=state.maxHp;
    state.level=1;
    state.exp=0;
    state.need=7;
    state.kills=0;
    state.baseEnemyHp=Math.max(4,Math.round(4.2*state.diff.hp));
    state.stage=STAGES[0];
    state.stageIndex=0;
    state.spawnAcc=0;
    state.bossSpawned.clear();
    state.activeBoss=null;
    manager = new WeaponManager(scene);
    manager.addWeapon("mg");
    scene.physics.resume();
    centerText(scene,"STAGE 1 — " + state.stage.name);
  }

  function updateDots(scene,time) {
    activeEnemies().forEach(e=>{
      if(e.burnUntil && e.burnUntil>time && time>(e.nextBurn||0)){
        e.nextBurn=time+260;
        damageEnemy(scene,e,e.burnDmg||.7);
      }
      if ((!e.slowUntil || e.slowUntil <= time) && (!e.freezeUntil || e.freezeUntil <= time) && !e.isBoss) {
        e.clearTint();
      }
    });
  }

  class MainScene extends Phaser.Scene {
    constructor(){ super("Main"); }

    preload() {
      for (const [key, dataUrl] of Object.entries(KENNEY_ASSET_DATA)) {
        this.load.image(key, dataUrl);
      }
      for (const [key, dataUrl] of Object.entries(WEAPON_ASSET_DATA)) {
        this.load.image(key, dataUrl);
      }
    }

    create() {
      state.scene=this;
      this.cameras.main.setBackgroundColor("#06131a");
      createTextures(this);
      createBackground(this);
      enemies=this.physics.add.group();
      bullets=this.physics.add.group();
      orbs=this.physics.add.group();
      createPlayer(this);
      createUi(this);
      keys=this.input.keyboard.addKeys({w:"W",a:"A",s:"S",d:"D",up:"UP",left:"LEFT",down:"DOWN",right:"RIGHT"});
      manager = new WeaponManager(this);
      this.cameras.main.startFollow(player,true,.08,.08);
      this.cameras.main.setZoom(1);
      this.physics.pause();
      setupStartDom(this);
    }
    update(time,delta) {
      updateBackground(this);
      if (!state.started || state.choosing || state.dead) { updateUi(this); return; }
      updateStage(this,time);
      movePlayer(this);
      spawnLoop(this,delta);
      updateEnemies(this,time);
      updateDots(this,time);
      manager.tick(time,delta);
      updateBullets(this,time);
      updateOrbs(this);
      updateContact(this,delta);
      updateUi(this);
    }
  }

  const config = {
    type: Phaser.AUTO,
    parent: "game",
    width: window.innerWidth,
    height: window.innerHeight,
    backgroundColor: "#03050a",
    physics: { default: "arcade", arcade: { gravity: { y: 0 }, debug: false } },
    scene: [MainScene],
    scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
    render: { antialias: true, pixelArt: false, roundPixels: false },
  };

  new Phaser.Game(config);
})();
</script>
</body>
</html>
