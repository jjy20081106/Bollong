<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#05070b" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>용원고등학교: 그림자 사건 MOBILE</title>
<link rel="manifest" href="./manifest.webmanifest" />
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #05070b;
    color: #eaf2ff;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action: none;
  }

  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #05070b;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }

  .hud {
    position: fixed;
    left: max(8px, env(safe-area-inset-left));
    top: max(8px, env(safe-area-inset-top));
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 5px;
    pointer-events: none;
  }

  .topRight {
    position: fixed;
    right: max(8px, env(safe-area-inset-right));
    top: max(8px, env(safe-area-inset-top));
    z-index: 10;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    pointer-events: none;
  }

  .box {
    background: rgba(9, 13, 20, .88);
    border: 2px solid #000;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.15), 0 2px 0 rgba(0,0,0,.55);
    border-radius: 8px;
    padding: 6px 8px;
    font-weight: 900;
    font-size: 12px;
    line-height: 1.25;
    text-shadow: 1px 1px 0 #000;
    white-space: pre-line;
  }

  .objective {
    width: min(46vw, 360px);
  }

  .hpOuter {
    width: 168px;
    height: 17px;
    background: rgba(0,0,0,.74);
    border: 2px solid #000;
    border-radius: 999px;
    overflow: hidden;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.12);
  }

  .hpInner {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #75ff9e, #e6ff77);
    transition: width .12s linear;
  }

  .moveZone {
    position: fixed;
    left: max(18px, env(safe-area-inset-left));
    bottom: calc(18px + env(safe-area-inset-bottom));
    z-index: 9;
    width: 148px;
    height: 148px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.18);
    background: radial-gradient(circle, rgba(255,255,255,.08), rgba(0,0,0,.18));
    box-shadow: inset 0 0 30px rgba(107,211,255,.08), 0 0 0 2px rgba(0,0,0,.22);
    pointer-events: none;
  }

  .moveZone::before {
    content: "이동";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: rgba(255,255,255,.48);
    font-size: 15px;
    font-weight: 1000;
    text-shadow: 1px 1px 0 #000;
  }

  .controls {
    position: fixed;
    right: max(10px, env(safe-area-inset-right));
    bottom: calc(12px + env(safe-area-inset-bottom));
    z-index: 12;
    display: grid;
    grid-template-columns: 82px 82px;
    gap: 9px;
  }

  button {
    font: inherit;
    touch-action: manipulation;
  }

  .btn {
    height: 68px;
    border: 2px solid #000;
    border-radius: 13px;
    background: linear-gradient(180deg, #7d8cbf, #4e5a84);
    color: white;
    font-weight: 1000;
    text-shadow: 1px 1px 0 #000;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.18), 0 3px 0 rgba(0,0,0,.65);
  }

  .btn:active, .btn.isDown {
    transform: translateY(2px);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.14), 0 1px 0 rgba(0,0,0,.65);
    filter: brightness(1.1);
  }

  .attackBtn {
    background: linear-gradient(180deg, #ff8676, #aa4455);
  }

  .btn small {
    display: block;
    font-size: 11px;
    opacity: .88;
    margin-top: 2px;
  }

  .joystick {
    position: fixed;
    z-index: 11;
    width: 126px;
    height: 126px;
    margin-left: -63px;
    margin-top: -63px;
    display: none;
    pointer-events: none;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.38);
    background: radial-gradient(circle, rgba(255,255,255,.12), rgba(0,0,0,.38));
    box-shadow: 0 0 0 2px rgba(0,0,0,.35), 0 0 24px rgba(105,201,255,.24);
  }

  .stick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 58px;
    height: 58px;
    margin-left: -29px;
    margin-top: -29px;
    border-radius: 50%;
    background: radial-gradient(circle, #f7fdff, #61d6ff);
    box-shadow: 0 0 0 3px rgba(0,0,0,.35);
  }

  .panel {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: rgba(0,0,0,.68);
    backdrop-filter: blur(4px);
    touch-action: manipulation;
  }

  .card {
    width: min(760px, 96vw);
    max-height: 90vh;
    overflow: hidden;
    background: #172033;
    border: 3px solid #000;
    box-shadow: inset 0 0 0 3px #657499, 0 18px 60px rgba(0,0,0,.55);
    border-radius: 14px;
    padding: 18px;
    touch-action: manipulation;
  }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(27px, 6.4vw, 44px);
    line-height: 1.05;
    text-shadow: 2px 2px 0 #000;
  }

  p {
    margin: 8px 0;
    color: #dce6fb;
    line-height: 1.55;
  }

  .mobileTip {
    border: 2px solid #000;
    background: rgba(97, 214, 255, .12);
    border-radius: 10px;
    padding: 9px 11px;
    font-weight: 900;
  }

  .wideBtn {
    width: 100%;
    margin-top: 14px;
    padding: 14px 16px;
    height: auto;
    font-size: 18px;
  }

  .dialogPanel {
    position: fixed;
    left: 50%;
    bottom: calc(100px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 28;
    width: min(94vw, 680px);
    display: none;
  }

  .dialogBox {
    background: rgba(14, 20, 32, .96);
    border: 3px solid #000;
    box-shadow: inset 0 0 0 3px #64759d, 0 12px 34px rgba(0,0,0,.55);
    border-radius: 12px;
    padding: 12px;
  }

  .dialogName {
    display: inline-block;
    min-width: 120px;
    background: #2c3b5d;
    border: 2px solid #000;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.14);
    border-radius: 8px;
    padding: 6px 9px;
    font-weight: 1000;
    color: #bdeeff;
    text-shadow: 1px 1px 0 #000;
    margin-bottom: 8px;
  }

  .dialogText {
    min-height: 58px;
    white-space: pre-line;
    line-height: 1.5;
    font-weight: 750;
    color: #eef5ff;
    text-shadow: 1px 1px 0 #000;
  }

  .dialogFooter {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    color: #bfcce3;
    font-size: 12px;
  }

  .dialogFooter .btn {
    width: 118px;
    height: 46px;
  }

  .toastWrap {
    position: fixed;
    left: 50%;
    bottom: calc(94px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 16;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
    width: min(92vw, 520px);
    align-items: center;
  }

  .toast {
    background: rgba(9, 13, 20, .9);
    border: 2px solid #000;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.18), 0 2px 0 rgba(0,0,0,.55);
    border-radius: 999px;
    padding: 8px 12px;
    font-weight: 900;
    font-size: 13px;
    text-shadow: 1px 1px 0 #000;
    animation: fade 2.2s forwards;
    text-align: center;
  }

  .rotateNotice {
    position: fixed;
    left: 50%;
    top: max(10px, env(safe-area-inset-top));
    transform: translateX(-50%);
    z-index: 18;
    display: none;
    padding: 7px 11px;
    border-radius: 999px;
    border: 2px solid #000;
    background: rgba(10,15,24,.86);
    color: #ffffff;
    font-weight: 1000;
    font-size: 12px;
    text-shadow: 1px 1px 0 #000;
    pointer-events: none;
  }

  @keyframes fade {
    0% { opacity: 0; transform: translateY(8px); }
    12%, 78% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-10px); }
  }

  @media (orientation: portrait) {
    .rotateNotice { display: block; }
    .objective { display: none; }
    .hud { transform: scale(.92); transform-origin: left top; }
    .moveZone { width: 126px; height: 126px; opacity: .72; }
    .controls { grid-template-columns: 76px 76px; gap: 7px; }
    .btn { height: 62px; font-size: 13px; }
    .dialogPanel { bottom: calc(140px + env(safe-area-inset-bottom)); }
  }

  @media (max-width: 700px) and (orientation: landscape) {
    .box { font-size: 11px; padding: 5px 7px; }
    .objective { width: min(43vw, 320px); }
    .controls { grid-template-columns: 78px 78px; gap: 7px; }
    .btn { height: 60px; font-size: 13px; }
    .moveZone { width: 128px; height: 128px; opacity: .8; }
    .dialogPanel { bottom: calc(86px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>

<div class="hud">
  <div class="box" id="mapName">구역: -</div>
  <div class="box" id="combatInfo">전투: -</div>
  <div class="hpOuter"><div class="hpInner" id="hpInner"></div></div>
  <div class="box" id="nearInfo">근처: -</div>
</div>

<div class="topRight">
  <div class="box objective" id="objectiveBox">현재 미션: -</div>
</div>

<div class="moveZone" aria-hidden="true"></div>

<div class="controls">
  <button class="btn attackBtn" id="btnAttack">공격<small>터치</small></button>
  <button class="btn" id="btnDash">대시<small>터치</small></button>
  <button class="btn" id="btnTalk">상호작용<small>대화/이동</small></button>
  <button class="btn" id="btnReset">리셋<small>재시작</small></button>
</div>

<div class="joystick" id="joy">
  <div class="stick" id="stick"></div>
</div>

<div class="toastWrap" id="toastWrap"></div>
<div class="rotateNotice">가로모드 권장 · 시작 시 전체화면 전환</div>

<div class="dialogPanel" id="dialogPanel">
  <div class="dialogBox">
    <div class="dialogName" id="dialogName">이름</div>
    <div class="dialogText" id="dialogText"></div>
    <div class="dialogFooter">
      <span id="dialogCounter">1/1</span>
      <button class="btn" id="dialogNextBtn">다음</button>
    </div>
  </div>
</div>

<div class="panel" id="startPanel">
  <div class="card">
    <h1>용원고등학교: 그림자 사건<br>MOBILE</h1>
    <p class="mobileTip"><b>모바일 최적화판:</b> 폰 브라우저/Netlify/GitHub Pages에서 바로 실행 가능. 시작하면 전체화면을 시도하고, 가로모드에서 가장 잘 보입니다.</p>
    <p><b>조작:</b> 왼쪽 아래/빈 화면 드래그로 이동, 오른쪽 버튼으로 공격·대시·상호작용·리셋.</p>
    <p><b>포함:</b> 타일맵, 충돌, 플레이어 이동, NPC, 미션, 몬스터 AI, 전투, 구역 이동.</p>
    <button class="btn wideBtn" id="startBtn">전체화면으로 시작</button>
  </div>
</div>

<script src="./src/core/tileset.js"></script>
<script src="./src/core/tilemap.js"></script>
<script src="./src/core/collision.js"></script>
<script src="./src/core/player.js"></script>
<script src="./src/maps/map_school_front.js"></script>
<script src="./src/systems/npc.js"></script>
<script src="./src/systems/quest.js"></script>
<script src="./src/systems/monster.js"></script>
<script src="./src/systems/combat.js"></script>
<script src="./src/systems/scene_manager.js"></script>
<script src="./src/main.js"></script>
<script>
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
